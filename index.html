<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ретро вазы для дома</title>
</head>
<body>
  <header>
    <nav>
      <ul class="container nav">
        <li>
          <a href="#" class="logo">
            <img src="img/logo.png" alt="Логотип магазина" class="logo-img">
          </a>
        </li>
        <li class="center-text">
          Укрась свой дом
        </li>
        <li class="right-section">
          <div class="site-search">
            <input type="search" id="search-input" placeholder="Поиск...">
            <button type="button" id="search-btn" class="fa fa-search"></button>
          </div>
          <select id="sort-select">
            <option value="default">Сортировка</option>
            <option value="price-asc">Цена по возрастанию</option>
            <option value="price-desc">Цена по убыванию</option>
          </select>
        </li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <section id="shop-items"></section>
    <p id="nothing-found"></p>
  </main>
  <footer id="contacts" class="container">
    <a href="#" class="logo">
      <img src="img/logo.png" alt="Логотип магазина" class="logo-img">
    </a>
  </footer>
  <template id="item-template">
    <div class="shop-item">
      <img src="">
      <div class="content">
        <h1></h1>
        <p></p>
        <span class="price"></span>
      </div>
    </div>
  </template>
  <script src="script.js"></script>
</body>
</html>
